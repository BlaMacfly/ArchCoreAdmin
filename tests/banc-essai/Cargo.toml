# Banc d'essai d'ArchCoreAdmin : charge l'AddOn dans le moteur d'AddOns d'ArchRust (sans affichage)
# et vérifie les commandes envoyées, la lecture des réponses d'ArchCore et la mise en page.
# Lancer : cargo run --release (depuis ce dossier).
[package]
name = "archcoreadmin-banc-essai"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# ArchRust est publié dans son propre dépôt (BlaMacfly/ArchRust, branche main) ; le catalogue des
# objets (ArchRust.SearchItems…) que le banc vérifie y est depuis la version qui l'a introduit.
# Pour essayer contre une copie locale d'ArchRust, créer .cargo/config.toml :
#   [patch."https://github.com/BlaMacfly/ArchRust"]
#   archrust-addons = { path = "<ArchRust>/crates/archrust-addons" }
# ou passer la même chose en ligne de commande :
#   cargo run --release --config 'patch."https://github.com/BlaMacfly/ArchRust".archrust-addons.path="<ArchRust>/crates/archrust-addons"'
archrust-addons = { git = "https://github.com/BlaMacfly/ArchRust", branch = "main" }
